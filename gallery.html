<dialog class="lightbox" id="gallery-viewer" aria-label="Enlarged photograph">
<button type="button" class="lightbox-close" aria-label="Close photograph">×</button><img alt="">
</dialog>
<script>
(function(){
'use strict';
const dialog=document.getElementById('gallery-viewer'),photo=dialog.querySelector('img'),close=dialog.querySelector('button');
let trigger;
document.querySelectorAll('.photo-card').forEach(function(button){button.addEventListener('click',function(){
if(typeof dialog.showModal!=='function'){window.location.href=button.dataset.image;return;}
trigger=button;photo.src=button.dataset.image;photo.alt=button.dataset.alt;dialog.showModal();close.focus();
});});
close.addEventListener('click',function(){dialog.close();});
dialog.addEventListener('click',function(event){if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
dialog.addEventListener('close',function(){photo.removeAttribute('src');if(trigger)trigger.focus();});
})();
</script>
